services:
  app:
    build: .
    image: rekomendasi-pembimbing:latest
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/app.db
      BACKUP_DIR: /backups
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - ./data:/data
      - ./backups:/backups
