[project]
name = "rekomendasi-pembimbing"
version = "0.1.0"
description = "Sistem rekomendasi dosen pembimbing skripsi berdasarkan bukti publikasi dan bimbingan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
